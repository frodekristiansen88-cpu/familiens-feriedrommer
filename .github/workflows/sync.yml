name: Synkroniser feriedrømmer
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*.py'
      - '.github/workflows/sync.yml'
permissions:
  contents: write
concurrency:
  group: sync-feriedrommer
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hent feriedrømmer fra Todoist
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: python scripts/sync_todoist.py
      - name: Importer tilgjengelige GPX-spor
        run: python scripts/import_gpx.py
      - name: Suppler manglende bilder med lisenskontrollert Wikimedia-foto
        run: python scripts/fetch_images.py
      - name: Lagre oppdaterte kartdata
        run: |
          if ! git diff --quiet -- places.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add places.json
            git commit -m "Oppdater feriedrømmer fra Todoist"
            # A workflow may run for several minutes while other commits arrive.
            # Integrate concurrent changes without force-pushing or replacing data.
            for attempt in 1 2 3 4; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Kartdata ble endret samtidig. Starter ikke en risikabel overskriving; kjør en ny synkronisering fra siste main."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "::error::Publisering mislyktes etter fire forsøk."
            exit 1
          fi
