name: Synkroniser feriedrømmer
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*.py'
permissions:
  contents: write
concurrency:
  group: sync-feriedrommer
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent feriedrømmer fra Todoist
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: python scripts/sync_todoist.py
      - name: Importer tilgjengelige GPX-spor
        run: python scripts/import_gpx.py
      - name: Suppler manglende bilder med lisenskontrollert Wikimedia-foto
        run: python scripts/fetch_images.py
      - name: Lagre oppdaterte kartdata
        run: |
          if ! git diff --quiet -- places.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add places.json
            git commit -m "Oppdater feriedrømmer fra Todoist"
            git push
          fi
