<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Familiens feriedrømmer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui,sans-serif;color:#18372e;background:#f6f8f5}header{background:#145744;color:white;padding:18px 24px}h1{margin:0;font-size:1.6rem}header p{margin:6px 0 0}main{display:grid;grid-template-columns:320px 1fr;height:calc(100dvh - 99px)}aside{overflow:auto;padding:16px}#map{height:100%}.card{background:white;border-radius:12px;padding:15px;margin-top:12px;box-shadow:0 1px 6px #0001}.pin{background:#fff;border:2px solid #145744;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 7px #0004}.photo{display:block;width:100%;max-height:170px;object-fit:cover;border-radius:9px;margin:9px 0}.card h2{font-size:1.1rem;margin:0 0 7px}.card p{font-size:.9rem}.details{white-space:pre-line;font-size:.88rem;line-height:1.55;margin-top:12px}.card details{margin-top:12px}.route-note{font-size:.82rem;color:#536b62;margin-top:8px}.route-stops{padding-left:22px;font-size:.88rem}.route-stops li{margin:6px 0}#typefilter{max-width:145px}.search-box{width:100%;box-sizing:border-box;margin:9px 0 5px;padding:11px;border:1px solid #ccd5d0;border-radius:8px;font:inherit;background:white}.tagbar{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.tag-chip{border:1px solid #bfcfc7;border-radius:20px;padding:4px 9px;background:#fff;color:#145744;font-size:12px;margin:0;cursor:pointer}.tag-chip.active{background:#145744;color:#fff}.result-count{font-size:12px;color:#536b62;margin:8px 0}.filter-heading{font-size:12px;font-weight:600;margin-top:8px}.map-route-control{background:white;padding:8px 12px;border-radius:7px!important;box-shadow:0 2px 9px #0003;font-size:13px;cursor:pointer}.map-route-control label{cursor:pointer;display:flex;align-items:center;gap:4px}.map-route-control input{accent-color:#145744;cursor:pointer}.card summary{cursor:pointer;font-weight:600}.leaflet-popup-content .details{max-height:220px;overflow:auto}a{color:#08735e;margin-right:12px}select,button{padding:9px;border:1px solid #ccd5d0;border-radius:8px;background:white;cursor:pointer}button{margin-top:12px}@media(max-width:700px){main{display:flex;flex-direction:column-reverse;height:auto}#map{height:55dvh}aside{overflow:visible}}.map-place-control{box-sizing:border-box;width:320px;max-width:calc(100vw - 76px);background:#fff;padding:10px 12px;border-radius:9px!important;box-shadow:0 2px 10px #0003;font:13px system-ui,sans-serif}.map-place-title{display:block;font-weight:700;color:#18372e}.map-place-form{display:flex;gap:5px;margin-top:8px}.map-place-form input{box-sizing:border-box;flex:1;min-width:0;width:100%;padding:8px 9px;border:1px solid #becbc3;border-radius:6px;font:13px system-ui,sans-serif}.map-place-form button{margin:0;padding:7px 10px;border:1px solid #becbc3;border-radius:6px;font:13px system-ui,sans-serif}.map-place-submit{background:#145744!important;color:#fff;border-color:#145744!important}.map-place-submit:disabled{opacity:.65;cursor:wait}.map-place-clear{font-size:19px!important;line-height:1}.map-place-status{font-size:11px;color:#50645b;margin-top:7px}.map-place-status:empty{display:none}.map-place-results{max-height:200px;overflow:auto;margin-top:5px}.map-place-result{display:flex;flex-direction:column;width:100%;text-align:left;gap:3px;margin:0;padding:8px;border-radius:0;border:0;border-bottom:1px solid #edf0ed;font-size:12px;white-space:normal;line-height:1.3}.map-place-result strong{font-weight:650}.map-place-result span{font-size:11px;color:#53665d}.map-place-result:hover,.map-place-result.active{background:#edf7f2}.map-place-credit{font-size:10px;margin-top:8px;color:#52685c}.map-place-credit a{color:#08735e;font-size:10px}@media(max-width:700px){.map-place-control{width:245px;max-width:calc(100vw - 75px);padding:8px}.map-place-results{max-height:130px}}
</style></head><body><header><h1>🌍 Familiens feriedrømmer</h1><p>Steder vi drømmer om å se og oppleve</p></header><main><aside><label for="search">Søk i feriedrømmer</label><input id="search" class="search-box" type="search" placeholder="Søk etter sted, land, foss, slott …" autocomplete="off"><label for="filter">Kategori: </label><select id="filter"><option value="Alle">Alle</option></select><label for="typefilter"> Turtype: </label><select id="typefilter"><option value="Alle">Alle</option><option value="Enkeltsted">Enkeltsteder</option><option value="Dagstur">Dagsturer</option><option value="Flerdagstur">Flerdagsturer</option></select><div class="filter-heading">Land og emneknagger</div><div id="tagbar" class="tagbar"></div><div id="result-count" class="result-count" aria-live="polite"></div><div id="cards"></div></aside><div id="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([45,5],5);window.ferieMap=map;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);const layer=L.layerGroup().addTo(map),overviewRoutes=L.layerGroup().addTo(map),routeLayer=L.layerGroup().addTo(map),cards=document.getElementById('cards'),filter=document.getElementById('filter'),typefilter=document.getElementById('typefilter'),search=document.getElementById('search'),tagbar=document.getElementById('tagbar'),resultCount=document.getElementById('result-count');let selectedTag='';let showroutes=true,redrawMap=()=>{};const routeToggle=L.control({position:'topright'});routeToggle.onAdd=function(){const div=L.DomUtil.create('div','leaflet-bar map-route-control');const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=true;check.setAttribute('aria-label','Vis GPS-ruter i kartet');label.append(check,document.createTextNode(' Vis GPS-ruter'));div.append(label);L.DomEvent.disableClickPropagation(div);L.DomEvent.disableScrollPropagation(div);check.addEventListener('change',()=>{showroutes=check.checked;if(showroutes){overviewRoutes.addTo(map)}else{map.removeLayer(overviewRoutes);routeLayer.clearLayers()}});return div};routeToggle.addTo(map);function addLink(parent,url,label){if(!url)return;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;parent.append(a)}const icons={'Fotturer':'🥾','Natur og utsikt':'🏞️','Byer og kultur':'🏛️','Aktiviteter og opplevelser':'🎢'};function addPhoto(parent,url){if(!url||!/^https:\/\//i.test(url))return;const img=document.createElement('img');img.src=url;img.alt='Bilde av reisemålet';img.loading='lazy';img.className='photo';img.onerror=()=>img.remove();parent.append(img);}function tourType(p){return p.routeType||((p.category==='Fotturer')?'Dagstur':'Enkeltsted')}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('nb-NO');const countries=['Tyskland','Østerrike','Spania','Portugal','Frankrike','Italia','Sveits','Norge','Danmark','Sverige','Kroatia','Slovenia','Tsjekkia','Nederland','Belgia','Polen','Storbritannia'];function countryTag(p){const raw=String(p.country||'');return countries.find(x=>norm(raw).includes(norm(x)))||raw.split(',').map(x=>x.trim()).filter(Boolean).at(-1)||''}function tagsFor(p){return [...new Set([countryTag(p),p.category,tourType(p),...(Array.isArray(p.tags)?p.tags:[])].filter(Boolean))]}function matchesSearch(p,q){const tokens=norm(q).split(/\s+/).filter(Boolean);const haystack=norm([p.name,p.country,p.category,tourType(p),p.description,p.details,...tagsFor(p)].join(' '));return tokens.every(w=>haystack.includes(w))}function routePoints(p){if(p.route&&Array.isArray(p.route.coordinates))return p.route.coordinates.filter(x=>Array.isArray(x)&&x.length>=2&&Number.isFinite(+x[0])&&Number.isFinite(+x[1])).map(x=>[+x[0],+x[1]]);return []}
function addRouteInfo(parent,p){const kind=tourType(p);const note=document.createElement('div');note.className='route-note';note.textContent='Turtype: '+kind+(p.route&&p.route.distanceKm?' · '+p.route.distanceKm+' km':'')+(p.route&&p.route.days?' · '+p.route.days+' dager':'');parent.append(note);if(p.routeUrl)addLink(parent,p.routeUrl,'⬇ GPX / rutekart');if(p.routeSource)addLink(parent,p.routeSource,'Rutekilde');if(p.routeNote){const n=document.createElement('p');n.className='route-note';n.textContent='⚠️ Foreløpig rute: '+p.routeNote;parent.append(n)}if(Array.isArray(p.stops)&&p.stops.length){const ol=document.createElement('ol');ol.className='route-stops';p.stops.forEach((s,i)=>{const li=document.createElement('li');li.textContent=(s.day?'Dag '+s.day+' · ':'')+(s.name||'Stopp '+(i+1))+(s.note?' – '+s.note:'');ol.append(li)});parent.append(ol)}}
function routeStages(p,pts){if(p.routeType!=='Flerdagstur'||!Array.isArray(p.stops)||p.stops.length<3||pts.length<12)return null;const breaks=[0];for(let i=1;i<p.stops.length-1;i++){const s=p.stops[i],start=breaks[breaks.length-1]+3;let best=-1,dist=Infinity;for(let j=start;j<pts.length-3;j++){const d=map.distance(pts[j],[+s.lat,+s.lng]);if(d<dist){dist=d;best=j}}if(best<0||dist>5000)return null;breaks.push(best)}breaks.push(pts.length-1);return breaks.slice(0,-1).map((v,i)=>pts.slice(v,breaks[i+1]+1))}
function putPath(p,pts,group,preview){const segments=routeStages(p,pts)||[pts];const colors=['#cf6229','#2879aa','#8e56b6','#278c6e','#af7d29'];const paths=[];segments.forEach((segment,i)=>{const options={color:segments.length>1?colors[i%colors.length]:(preview?'#ca681c':'#d56825'),weight:preview?4:5,opacity:.9};if(preview)options.dashArray='8,5';const line=L.polyline(segment,options).addTo(group);line.bindTooltip(p.name+(segments.length>1?' · dag '+(i+1):'')+' · Foreløpig GPS-spor');if(preview)line.on('click',()=>showRoute(p));paths.push(line)});return paths}
function showRoute(p){routeLayer.clearLayers();const pts=routePoints(p);if(pts.length>=2){putPath(p,pts,routeLayer,false);if(Array.isArray(p.stops))p.stops.forEach((s,i)=>{if(Number.isFinite(+s.lat)&&Number.isFinite(+s.lng))L.marker([+s.lat,+s.lng],{icon:L.divIcon({className:"",html:"<div class=\"pin\">"+(i+1)+"</div>",iconSize:[38,38],iconAnchor:[19,19]})}).bindPopup(String(s.name||"Stopp "+(i+1))+(s.note?" – "+s.note:"")).addTo(routeLayer)});map.fitBounds(L.latLngBounds(pts),{padding:[50,50]});return true}const stops=Array.isArray(p.stops)?p.stops.filter(s=>Number.isFinite(+s.lat)&&Number.isFinite(+s.lng)):[];if(stops.length){const bounds=[];stops.forEach((s,i)=>{const pos=[+s.lat,+s.lng];L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="pin">'+(i+1)+'</div>',iconSize:[38,38],iconAnchor:[19,19]})}).bindPopup(String(s.name||'Stopp '+(i+1))).addTo(routeLayer);bounds.push(pos)});if(bounds.length>1){L.polyline(bounds,{color:'#d56825',weight:3,dashArray:'6,8'}).addTo(routeLayer);map.fitBounds(bounds,{padding:[50,50]})}else map.setView(bounds[0],12);return true}return false}
function draw(items){layer.clearLayers();overviewRoutes.clearLayers();routeLayer.clearLayers();cards.replaceChildren();const bounds=[];for(const p of items){if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng))continue;const symbol=icons[p.category]||'📍';const pts=routePoints(p);if(pts.length>=2)putPath(p,pts,overviewRoutes,true);const marker=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="pin">'+symbol+'</div>',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(layer);const popup=document.createElement('div');const strong=document.createElement('strong');strong.textContent=p.name;popup.append(strong,document.createElement('br'));addPhoto(popup,p.image);if(p.imageCredit){const credit=document.createElement('small');credit.textContent='Foto: '+p.imageCredit+' ';popup.append(credit);addLink(credit,p.imageSource,'Kilde');addLink(credit,p.imageLicense,'Lisens');popup.append(document.createElement('br'))}popup.append(document.createTextNode(p.description||''),document.createElement('br'));addRouteInfo(popup,p);if(p.details){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='Les mer om stedet';const t=document.createElement('div');t.className='details';t.textContent=p.details;d.append(s,t);popup.append(d)}addLink(popup,p.video,'Video');addLink(popup,p.todoist,'Todoist');addLink(popup,p.info,'Mer informasjon');marker.bindPopup(popup);bounds.push([p.lat,p.lng]);const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=p.name;c.append(h);const meta=document.createElement('small');meta.textContent=p.country+' · '+p.category;c.append(meta);addPhoto(c,p.image);if(p.imageCredit){const credit=document.createElement('small');credit.textContent='Foto: '+p.imageCredit+' ';c.append(credit);addLink(credit,p.imageSource,'Kilde');addLink(credit,p.imageLicense,'Lisens')}const desc=document.createElement('p');desc.textContent=p.description;c.append(desc);addRouteInfo(c,p);if(p.details){const d=document.createElement('details');const s=document.createElement('summary');s.textContent='Les mer om stedet';const t=document.createElement('div');t.className='details';t.textContent=p.details;d.append(s,t);c.append(d)}addLink(c,p.video,'🎬 Video');addLink(c,p.todoist,'✓ Todoist');addLink(c,p.info,'ℹ Info');const b=document.createElement('button');b.textContent='Vis på kartet';b.onclick=()=>{if(!showRoute(p))map.setView([p.lat,p.lng],12);marker.openPopup();window.scrollTo({top:0,behavior:'smooth'})};c.append(document.createElement('br'),b);cards.append(c)}if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:11})}fetch('places.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Kartdata kunne ikke lastes');return r.json()}).then(data=>{for(const category of [...new Set(data.map(p=>p.category))].sort()){const o=document.createElement('option');o.value=category;o.textContent=category;filter.append(o)}const tagCounts=new Map();for(const p of data)for(const t of tagsFor(p))tagCounts.set(t,(tagCounts.get(t)||0)+1);const tagOrder=[...tagCounts.keys()].sort((a,b)=>{const ac=countries.includes(a),bc=countries.includes(b);return ac!==bc?(ac?-1:1):a.localeCompare(b,'nb')});function updateTags(){tagbar.replaceChildren();for(const tag of tagOrder){const btn=document.createElement('button');btn.type='button';btn.className='tag-chip'+(selectedTag===tag?' active':'');btn.textContent=tag+' ('+tagCounts.get(tag)+')';btn.setAttribute('aria-pressed',String(selectedTag===tag));btn.onclick=()=>{selectedTag=selectedTag===tag?'':tag;redraw();};tagbar.append(btn)}}function redraw(){const query=search.value.trim();const filtered=data.filter(p=>(filter.value==='Alle'||p.category===filter.value)&&(typefilter.value==='Alle'||tourType(p)===typefilter.value)&&(!selectedTag||tagsFor(p).includes(selectedTag))&&matchesSearch(p,query));updateTags();resultCount.textContent=filtered.length+' av '+data.length+' reisemål';draw(filtered);if(!filtered.length){const message=document.createElement('p');message.textContent='Ingen treff. Prøv andre søkeord eller fjern et filter.';cards.append(message)}}filter.onchange=redraw;typefilter.onchange=redraw;search.addEventListener('input',redraw);redrawMap=redraw;redraw()}).catch(e=>cards.textContent=e.message)</script><script src="map-search.js" defer></script></body></html>
