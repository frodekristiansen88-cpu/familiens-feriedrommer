<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Familiens feriedrømmer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui,sans-serif;color:#18372e;background:#f6f8f5}header{background:#145744;color:white;padding:18px 24px}h1{margin:0;font-size:1.6rem}header p{margin:6px 0 0}main{display:grid;grid-template-columns:320px 1fr;height:calc(100dvh - 99px)}aside{overflow:auto;padding:16px}#map{height:100%}.card{background:white;border-radius:12px;padding:15px;margin-top:12px;box-shadow:0 1px 6px #0001}.pin{background:#fff;border:2px solid #145744;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 7px #0004}.photo{display:block;width:100%;max-height:170px;object-fit:cover;border-radius:9px;margin:9px 0}.card h2{font-size:1.1rem;margin:0 0 7px}.card p{font-size:.9rem}a{color:#08735e;margin-right:12px}select,button{padding:9px;border:1px solid #ccd5d0;border-radius:8px;background:white;cursor:pointer}button{margin-top:12px}@media(max-width:700px){main{display:flex;flex-direction:column-reverse;height:auto}#map{height:55dvh}aside{overflow:visible}}</style></head><body><header><h1>🌍 Familiens feriedrømmer</h1><p>Steder vi drømmer om å se og oppleve</p></header><main><aside><label for="filter">Kategori: </label><select id="filter"><option value="Alle">Alle</option></select><div id="cards"></div></aside><div id="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([45,5],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);const layer=L.layerGroup().addTo(map),cards=document.getElementById('cards'),filter=document.getElementById('filter');function addLink(parent,url,label){if(!url)return;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;parent.append(a)}const icons={'Fotturer':'🥾','Natur og utsikt':'🏞️','Byer og kultur':'🏛️','Aktiviteter og opplevelser':'🎢'};function addPhoto(parent,url){if(!url||!/^https:\/\//i.test(url))return;const img=document.createElement('img');img.src=url;img.alt='Bilde av reisemålet';img.loading='lazy';img.className='photo';img.onerror=()=>img.remove();parent.append(img);if(url&&parent){const credit=parent.dataset?null:null}}function draw(items){layer.clearLayers();cards.replaceChildren();const bounds=[];for(const p of items){if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng))continue;const symbol=icons[p.category]||'📍';const marker=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="pin">'+symbol+'</div>',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(layer);const popup=document.createElement('div');const strong=document.createElement('strong');strong.textContent=p.name;popup.append(strong,document.createElement('br'));addPhoto(popup,p.image);if(p.imageCredit){const credit=document.createElement('small');credit.textContent='Foto: '+p.imageCredit+' ';popup.append(credit);addLink(credit,p.imageSource,'Kilde');addLink(credit,p.imageLicense,'Lisens');popup.append(document.createElement('br'))}popup.append(document.createTextNode(p.description||''),document.createElement('br'));addLink(popup,p.video,'Video');addLink(popup,p.todoist,'Todoist');addLink(popup,p.info,'Mer informasjon');marker.bindPopup(popup);bounds.push([p.lat,p.lng]);const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=p.name;c.append(h);const meta=document.createElement('small');meta.textContent=p.country+' · '+p.category;c.append(meta);addPhoto(c,p.image);if(p.imageCredit){const credit=document.createElement('small');credit.textContent='Foto: '+p.imageCredit+' ';c.append(credit);addLink(credit,p.imageSource,'Kilde');addLink(credit,p.imageLicense,'Lisens')}const desc=document.createElement('p');desc.textContent=p.description;c.append(desc);addLink(c,p.video,'🎬 Video');addLink(c,p.todoist,'✓ Todoist');addLink(c,p.info,'ℹ Info');const b=document.createElement('button');b.textContent='Vis på kartet';b.onclick=()=>{map.setView([p.lat,p.lng],12);marker.openPopup();window.scrollTo({top:0,behavior:'smooth'})};c.append(document.createElement('br'),b);cards.append(c)}if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:11})}fetch('places.json').then(r=>{if(!r.ok)throw Error('Kartdata kunne ikke lastes');return r.json()}).then(data=>{for(const category of [...new Set(data.map(p=>p.category))].sort()){const o=document.createElement('option');o.value=category;o.textContent=category;filter.append(o)}filter.onchange=()=>draw(filter.value==='Alle'?data:data.filter(p=>p.category===filter.value));draw(data)}).catch(e=>cards.textContent=e.message)</script></body></html>
